plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.seleniumhq.selenium:selenium-bom:4.51.0')
    implementation 'org.seleniumhq.selenium:selenium-remote-driver'
    implementation 'org.seleniumhq.selenium:selenium-firefox-driver'
    implementation 'org.seleniumhq.selenium:selenium-chrome-driver'

    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.platform:junit-platform-suite'
    testImplementation platform('io.cucumber:cucumber-bom:8.0.4')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.testcontainers:testcontainers-selenium'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
}
