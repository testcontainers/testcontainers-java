apply plugin: 'com.gradleup.shadow'

description = "Testcontainers Core"

sourceSets {
    jarFileTest
}

test.maxParallelForks = 4

idea.module.testSourceDirs += sourceSets.jarFileTest.allSource.srcDirs

jar {
    manifest {
        attributes('Implementation-Version': project.getProperty("version"))
    }
}

shadowJar {
    [
        'META-INF/NOTICE',
        'META-INF/NOTICE.txt',
        'META-INF/LICENSE',
        'META-INF/LICENSE.txt',
        'META-INF/maven/',
        'META-INF/proguard/',
        'META-INF/versions/*/module-info.class',
        'META-INF/services/java.security.Provider',
        'META-INF/DEPENDENCIES',
        'META-INF/AL2.0',
        'META-INF/LGPL2.1',
    ].each { exclude(it) }
}

afterEvaluate {
    // gradle/shading.gradle replaces shadowJar.relocators within its own afterEvaluate
    // block, so these must be registered afterwards. The auto-generated relocations
    // only cover class packages; the httpclient5/httpcore5 resources (version.properties)
    // would otherwise stay behind at their original paths.
    tasks.shadowJar.relocate('org.apache.hc.client5', 'org.testcontainers.shaded.org.apache.hc.client5')
    tasks.shadowJar.relocate('org.apache.hc.core5', 'org.testcontainers.shaded.org.apache.hc.core5')
}

task jarFileTest(type: Test) {
    useJUnitPlatform()
    testClassesDirs = sourceSets.jarFileTest.output.classesDirs
    classpath = sourceSets.jarFileTest.runtimeClasspath

    inputs.files(shadowJar).withPathSensitivity(PathSensitivity.RELATIVE)
    systemProperty("jarFile", project.projectDir.toPath().relativize(shadowJar.outputs.files.singleFile.toPath()).toString())

    dependsOn(shadowJar)
}
project.tasks.check.dependsOn(jarFileTest)

tasks.japicmp {
    packageExcludes = [
        "com.github.dockerjava.*",
        "org.testcontainers.shaded.*",
    ]

    classExcludes = []

    methodExcludes = []

    fieldExcludes = []
}

configurations.all {
    resolutionStrategy {
        force 'com.fasterxml.jackson.core:jackson-databind:2.18.4'
        force 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.4'
    }
}

dependencies {
    api 'org.slf4j:slf4j-api:1.7.36'
    compileOnly 'org.jetbrains:annotations:26.1.0'
    testCompileOnly 'org.jetbrains:annotations:26.1.0'
    api 'org.apache.commons:commons-compress:1.28.0'
    api ('org.rnorth.duct-tape:duct-tape:1.0.8') {
        exclude(group: 'org.jetbrains', module: 'annotations')
    }

    provided('com.google.cloud.tools:jib-core:0.28.2') {
        exclude group: 'com.google.guava', module: 'guava'
        exclude group: 'com.fasterxml.jackson.datatype', module: 'jackson-datatype-jsr310'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-core'
        exclude group: 'com.fasterxml.jackson.core', module: 'jackson-databind'
        exclude group: 'org.apache.commons', module: 'commons-compress'
    }

    shaded 'org.awaitility:awaitility:4.3.0'

    api platform('com.github.docker-java:docker-java-bom:3.7.1')
    shaded platform('com.github.docker-java:docker-java-bom:3.7.1')

    api "com.github.docker-java:docker-java-api"
    api 'com.github.docker-java:docker-java-transport'

    shaded('com.github.docker-java:docker-java-core') {
        exclude group: 'com.google.guava', module: 'guava'
    }

    // Embed the HTTP transport ourselves instead of depending on
    // com.github.docker-java:docker-java-transport-zerodep, whose jar bundles
    // httpclient5 5.5.1 / httpcore5(-h2) 5.3.6, affected by CVE-2026-54428
    // (see https://github.com/testcontainers/testcontainers-java/issues/11973).
    // httpclient5 5.6.4 brings httpcore5 5.4.3, the first fixed version.
    shaded 'com.github.docker-java:docker-java-transport-httpclient5'
    shaded 'org.apache.httpcomponents.client5:httpclient5:5.6.4'

    // docker-java-transport-httpclient5 depends on JNA, which used to reach the api
    // configuration transitively via docker-java-transport-zerodep. Declared as an api
    // dependency here, JNA is excluded from the shaded jar and left unrelocated: shaded
    // (relocated) JNA classes cannot bind the native jnidispatch library, whose JNI
    // symbols and embedded resource path stay at com/sun/jna/... - relocating them
    // breaks DockerClientProviderStrategy resolution with an UnsatisfiedLinkError in
    // RootlessDockerClientProviderStrategy (ci/circleci: minimal_core failure).
    api 'net.java.dev.jna:jna:5.18.1'

    shaded 'com.google.guava:guava:33.3.1-jre'
    shaded "org.yaml:snakeyaml:2.6"

    shaded 'org.glassfish.main.external:trilead-ssh2-repackaged:4.1.2'

    shaded 'org.zeroturnaround:zt-exec:1.13.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.3'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testImplementation('com.google.cloud.tools:jib-core:0.28.2')  {
        exclude group: 'com.google.guava', module: 'guava'
    }
    testImplementation 'org.apache.httpcomponents:httpclient:4.5.14'
    testImplementation 'redis.clients:jedis:7.4.1'
    testImplementation 'com.rabbitmq:amqp-client:5.35.0'
    testImplementation 'org.mongodb:mongo-java-driver:3.12.14'

    testImplementation ('org.mockito:mockito-core:4.11.0') {
        exclude(module: 'hamcrest-core')
    }
    // Synthetic JAR used for MountableFileTest and DirectoryTarResourceTest
    testImplementation files('testlib/repo/fakejar/fakejar/0/fakejar-0.jar')

    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'io.rest-assured:rest-assured:5.5.7'

    jarFileTestCompileOnly "org.projectlombok:lombok:${lombok.version}"
    jarFileTestAnnotationProcessor "org.projectlombok:lombok:${lombok.version}"
    jarFileTestRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.3'
    jarFileTestImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    jarFileTestImplementation 'org.assertj:assertj-core:3.27.7'
    jarFileTestImplementation 'org.ow2.asm:asm-debug-all:5.2'
}

tasks.generatePomFileForMavenJavaPublication.finalizedBy(
    tasks.register('checkPOMdependencies', org.testcontainers.build.ComparePOMWithLatestReleasedTask) {
        ignore = [
            // previously pulled in transitively by docker-java-transport-zerodep (#11973)
            'com.github.docker-java:docker-java-transport',
            // same for JNA, previously pulled in transitively by docker-java-transport-zerodep (#11973)
            'net.java.dev.jna:jna',
        ]
    }
)

compileTestJava {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(17)
    }
    options.release.set(17)
}

test {
    useJUnitPlatform()
}
