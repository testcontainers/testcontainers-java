apply plugin: 'com.diffplug.spotless'

spotless {
    java {
        toggleOffOn()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()

        prettier(['prettier': '2.5.1', 'prettier-plugin-java': '1.6.1'])
            .config([
                'parser'    : 'java',
                'tabWidth'  : 4,
                'printWidth': 120
            ])

        importOrder('', 'java', 'javax', '\\#')
    }
    // greclipse downloads its Eclipse dependencies even when nothing matches the target,
    //  so only configure it in projects that actually contain Groovy sources.
    if (!fileTree('src') { include '**/*.groovy' }.isEmpty()) {
        groovyGradle {
            target '**/*.groovy'
            greclipse('4.19')
        }
    }
}
